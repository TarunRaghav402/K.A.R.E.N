name: Build macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"

      - name: Install sidecar build dependencies
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/bin/python -m pip install --upgrade pip
          sidecar/.venv/bin/python -m pip install -e sidecar pyinstaller

      - name: Package the app
        run: bash scripts/package_app.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: K.A.R.E.N.-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: K.A.R.E.N.-macos-*
          merge-multiple: true

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
